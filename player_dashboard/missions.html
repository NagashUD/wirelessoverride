const coffresConfig = {
  coffre_armes: { max: 4 },
  coffre_armures: { max: 4 },

};


async function getEquippedInventory(playerID) {
  const coffres = {};

  const playerRef = doc(db, "players", playerID);
  const playerSnap = await getDoc(playerRef);

  if (!playerSnap.exists()) {
    console.error(`❌ Le joueur avec l'ID ${playerID} n'existe pas.`);
    return coffres;
  }

  const data = playerSnap.data();
  console.log("📄 Données brutes Firestore :", data);

  for (const [categorie, config] of Object.entries(coffresConfig)) {
    coffres[categorie] = [];

    const slots = data[categorie] || {};
    console.log("📦 Catégories dans Firestore :", Object.keys(data));
    console.log("📚 Catégories attendues :", Object.keys(coffresConfig));

    for (let i = 0; i < config.max; i++) {
      const slotName = `slot${i}`;
      const itemData = slots[slotName];

      if (itemData && itemData.id) {
        coffres[categorie].push({
          slot: slotName,
          ...itemData
        });

        console.log(`✅ Item "${itemData.id}" trouvé dans ${categorie} - ${slotName}`);
      } else if (itemData) {
        console.warn(`⚠️ Item partiel ou sans ID dans ${categorie} - ${slotName}`, itemData);
        coffres[categorie].push({
          slot: slotName,
          ...itemData,
          vide: true
        });
      } else {
        coffres[categorie].push({
          slot: slotName,
          vide: true
        });
      }
    }
  }

  console.log("🧠 Résultat final des coffres :", coffres);
  return coffres;
}

function displayMissions(vehicle) {
  const auth = getAuth();
  const playerId = auth.currentUser?.uid;

  if (!playerId) {
    console.warn("❌ Aucun utilisateur connecté !");
    return;
  }

  const allTabs = ["missions-standard", "missions-role", "missions-special"];
  allTabs.forEach(id => {
    const container = document.getElementById(id);
    if (container) container.innerHTML = "";
  });

  const activeTabId = document.querySelector('.tab.active').dataset.tab;
  const missionsList = document.getElementById(activeTabId);

  let filtered = missions.filter(m => m.type === activeTabId);

  // 🔍 Filtrage basé sur le rôle du joueur pour les missions qui le nécessitent
  filtered = filtered.filter(m => {
    if (m.roles && m.roles.length > 0) {
      if (!playerRole) {
        console.log(`❌ Mission "${m.titre}" ignorée car aucun rôle défini pour le joueur.`);
        return false;
      }
      const match = m.roles.includes(playerRole);
      console.log(`🔎 Mission "${m.titre}" requiert rôle(s) ${m.roles.join(", ")}, joueur: ${playerRole} => ${match ? "✅ OK" : "❌ NON"}`);
      return match;
    }
    return true; // Aucune restriction de rôle => mission valide
  });

  filtered.forEach(m => {
    const stats = calcMissionStats(m, vehicle);

    const missionCard = document.createElement("div");
    missionCard.className = "mission-card";
    missionCard.innerHTML = `
      <img src="${m.image || 'https://via.placeholder.com/150'}" alt="${m.titre}">
      <div class="mission-info">
        <h3>${m.titre}</h3>
        <p>${m.description}</p>
        <ul class="mission-details">
          <li><strong>⏳ Durée :</strong> ${stats.duree} min</li>
          <li><strong>⚠️ Risque :</strong> ${stats.risque} %</li>
          <li><strong>💰 Récompense :</strong> ${m.recompense} crédits</li>
          <li><strong>🔧 Usure :</strong> ${stats.usure} %</li>
          
        </ul>
      </div>
    `;

// 💡 Clic direct sur la carte entière pour ouvrir le popup
missionCard.style.cursor = "pointer";
missionCard.addEventListener("click", () => handleMissionPopup(playerId, m));

missionsList.appendChild(missionCard);
  });

}

  const playerEquippedItems = await getEquippedInventory(playerId);

const renderItemList = (items) => {
  return items.map(item => {
    if (!item || !item.id) return ''; // skip les items vides ou invalides

    const attaque = item.stats?.attaque ?? "-";
    const ammotype = item.stats?.ammotype ?? "-";
    const image = item.image || "https://via.placeholder.com/32";

    return `
      <div class="equip-line" style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
        <img src="${image}" alt="${item.nom}" style="width: 32px; height: 32px; object-fit: contain;">
        <div>
          <strong>${item.nom}</strong><br>
          ⚔️ Attaque : ${attaque} | 🧨 Munition : ${ammotype}
        </div>
      </div>
    `;
  }).join("");
};


  // 🧱 Injection du contenu HTML
  const equipHTML = `
    <h4>⚔️ Armes équipées :</h4>
    ${renderItemList(playerEquippedItems.coffre_arme_equipee)}

    <h4>🛡️ Armures équipées :</h4>
    ${renderItemList(playerEquippedItems.coffre_armure_equipee)}

    <h4>🎯 Munitions équipées :</h4>
    ${renderItemList(playerEquippedItems.coffre_munitions_equipee)}

    <h4>📡 Drones actifs :</h4>
    ${renderItemList(playerEquippedItems.coffre_drones_equipee)}

    <h4>🧬 Cybernétiques installés :</h4>
    ${renderItemList(playerEquippedItems.coffre_cybernetiques_installees)}
  `;

  equipContainer.innerHTML = equipHTML;

  // 🎯 Mise à jour du contenu mission
  popup.querySelector("#popup-title").textContent = mission.titre;
  popup.querySelector("#popup-image").src = mission.image || 'https://via.placeholder.com/150';

  popup.style.display = "flex";
  popup.addEventListener("click", closeOnOverlayClick);

  // 🎮 Boutons
  document.getElementById('cancel-mission').onclick = closeMissionPopup;
document.getElementById('confirm-mission').onclick = async () => {
  const playerId = localStorage.getItem("playerId");
  const equippedItems = await getEquippedInventory(playerId);
  const result = await executeMissionTest(mission, equippedItems);

  if (result.success) {
    alert(`✅ Mission réussie ! Récompense : ${mission.recompense + result.bonus} crédits`);
  } else {
    alert("❌ Mission échouée. Mieux vaut être mieux préparé la prochaine fois !");
  }

  closeMissionPopup();
};

}


function closeOnOverlayClick(event) {
  // Ne ferme que si on clique *sur* l'overlay (le fond noir), pas sur le contenu
  if (event.target.classList.contains("popup-overlay")) {
    closeMissionPopup();
  }
}

function closeMissionPopup() {
  const popup = document.getElementById("mission-popup");
  popup.style.display = "none";
  popup.removeEventListener("click", closeOnOverlayClick);
}

function calcMissionStats(mission, vehicle) {
  const aPied = !vehicle || vehicle.id === "none";

  return {
    duree: aPied ? mission.baseDuree * 1.8 : mission.baseDuree, // durée augmentée à pied
    risque: aPied ? mission.baseRisque + 15 : mission.baseRisque, // risque augmenté à pied
    usure: aPied ? 0 : mission.usure || 10 // pas d’usure si à pied
  };
}


  function updateTimer() {
    if (rotationTimer > 0) {
      rotationTimer--;
      missionTimerEl.textContent = new Date(rotationTimer * 1000).toISOString().substr(14, 5);
      Object.keys(specialCooldowns).forEach(id => {
        if (specialCooldowns[id] > 0) specialCooldowns[id]--;
      });
      displaySpecialMissions(getSelectedVehicle());
    } else {
      missionTimerEl.textContent = "Rotation en cours...";
      rotationTimer = 600;
    }
  }
function setupTabs() {
  document.querySelectorAll('.tab').forEach(button => {
    button.addEventListener('click', () => {
      document.querySelector('.tab.active').classList.remove('active');
      button.classList.add('active');

    });

}


  // -------------------------
  // 🔧 Données véhicules
  // -------------------------
  let playerVehicles = [];

  function getSelectedVehicle() {
    const select = document.getElementById("vehicle-select");
    const selectedId = select.value;
    return playerVehicles.find(v => v.id === selectedId) || null;
  }



function initVehicleSelector() {
  const select = document.getElementById("vehicle-select");
  select.innerHTML = "";

  // Option par défaut
  const optionDefault = document.createElement("option");
  optionDefault.value = "none";
  optionDefault.textContent = "À pied (aucun véhicule)";
  select.appendChild(optionDefault);

  // Ajout des véhicules
  if (Array.isArray(playerVehicles)) {
    playerVehicles.forEach(vehicle => {
      const option = document.createElement("option");
      option.value = vehicle.id;
      option.textContent = vehicle.nom || vehicle.id;
      select.appendChild(option);
    });
  } else {
    console.warn("🚨 playerVehicles n'est pas un tableau :", playerVehicles);
  }

  // Événement de sélection
  select.addEventListener("change", () => {
    const selectedId = select.value;

    if (selectedId === "none") {
      console.log("🚶 Aucun véhicule sélectionné");
      document.getElementById("fuel").textContent = "--";
      document.getElementById("wear").textContent = "--";
      return;
    }

    const selectedVehicle = playerVehicles.find(v => v.id === selectedId);

    if (selectedVehicle) {
      console.log("🚗 Véhicule sélectionné :", selectedVehicle);
      displayVehicleStats(selectedVehicle);
    } else {
      console.warn("⚠️ Aucun véhicule trouvé avec l'ID :", selectedId);
      document.getElementById("fuel").textContent = "--";
      document.getElementById("wear").textContent = "--";
    }
  });





  // Affiche la première mission par défaut avec l'option "à pied"
  if (missions.length > 0) {

      displayVehicleStats(getSelectedVehicle());
  }
}

function updateVehicleStatsInfo(vehicleId) {
  const infoDiv = document.getElementById("vehicle-stats-info");
    console.log("🔍 Véhicule sélectionné :", selectedVehicle);

  if (vehicleId === "none") {

}

function displayVehicleStats(vehicle) {
  if (!vehicle) {
    console.warn("⚠️ Aucun véhicule sélectionné pour afficher les stats.");
    return;
  }

  const fuelSpan = document.getElementById("fuel");
  const wearSpan = document.getElementById("wear");

  // Récupère la map mise à jour depuis Firestore (déjà stockée côté client)
  const carburantMap = window.carburantParVehicule || {}; // À mettre à jour dans onAuthStateChanged si pas déjà fait

  const currentFuel = carburantMap[vehicle.id] ?? vehicle.stats?.carburant ?? 0;
  const maxFuel = vehicle.stats?.carburant_max ?? 100;

  fuelSpan.textContent = `${currentFuel} / ${maxFuel}`;
  wearSpan.textContent = vehicle.stats?.usure ? `${vehicle.stats.usure}%` : "100%";
}

async function runMissionTest(missionId) {
  const playerId = auth.currentUser?.uid;
  if (!playerId) return alert("Aucun joueur connecté");

  const playerSnap = await getDoc(doc(firestore, "players", playerId));
  if (!playerSnap.exists()) return alert("Données joueur introuvables");
  const playerData = playerSnap.data();

  const role = playerData.role;
  const attributs = attributesData[role] || {};
  const coffres = playerData;

  const mission = missions.find(m => m.id === missionId);
  if (!mission) return alert("Mission introuvable");

  let totalScore = 0;
  const statsPrincipales = ["force", "endurance", "agilite", "intelligence", "tech_affinite", "perception"];
  statsPrincipales.forEach(stat => {
    totalScore += parseInt(attributs[stat] || 0);
  });
  totalScore += 1; // bonus de chance

const armesEquipees = Object.values(coffres.coffre_arme_equipee || {}).filter(a =>
  a && Object.keys(a).length > 0 && a.stats && a.stats.attaque
);
  let attaqueTotale = 0;
  let nomsArmes = [];

  let malusMunitions = 0;
  let malusArmes = 0;

  // ✅ Appliquer les malus immédiatement si aucune arme n'est équipée
if (armesEquipees.length === 0) {
  malusArmes = (typeof mission.malus_arme_si_aucune === "number") ? mission.malus_arme_si_aucune : 10;
  malusMunitions = (typeof mission.malus_si_pas_assez === "number") ? mission.malus_si_pas_assez : 5;
  console.warn("❌ Aucune arme équipée, malus armes et munitions appliqués");
}
for (const [slotKey, arme] of Object.entries(coffres.coffre_arme_equipee)) {
  if (arme?.maxusure !== undefined) {
    const usure = Math.floor(Math.random() * 5) + 3; // 3 à 7
    const ancienneUsure = arme.usure ?? arme.maxusure;
    const nouvelleUsure = Math.max(0, ancienneUsure - usure);
    arme.usure = nouvelleUsure;

    console.log(`🔧 Usure appliquée à ${arme.nom} : -${usure}, reste ${nouvelleUsure}`);

    // 🔁 Mise à jour dans Firestore
    try {
   await updateDoc(doc(firestore, "players", playerId), {
 [`coffre_arme_equipee.${slotKey}.usure`]: nouvelleUsure
});
    } catch (error) {
      console.error(`Erreur de mise à jour de l'usure pour ${arme.nom}`, error);
    }
    
  }
}
const armeHS = armesEquipees.find(a => a.usure !== undefined && a.usure <= 0);
if (armeHS) {
  alert(`⚠️ L'arme ${armeHS.nom} est trop endommagée pour être utilisée !`);
  return; // ou désactiver ses effets pendant la mission
}

  // 🧠 Si des armes sont équipées, on fait la vérification
for (const arme of armesEquipees) {
  if (arme?.stats?.attaque) {
    attaqueTotale += parseInt(arme.stats.attaque);
  }
  if (arme?.nom) {
    nomsArmes.push(arme.nom);
  }
console.log("🧪 Munitions équipées :", coffres.coffre_munitions_equipee);
console.log("🔎 Recherche munition avec ID :", arme.ammotype);

  if (arme?.ammotype) {
    
  const munitionsEquipees = Array.isArray(coffres.coffre_munitions_equipee)
  ? coffres.coffre_munitions_equipee
  : Object.values(coffres.coffre_munitions_equipee || {});

const munition = munitionsEquipees.find(m => m?.id === arme.ammotype);
if (!munition) {
  console.warn(`⚠️ Aucune munition avec id ${arme.ammotype} trouvée dans le coffre !`);
} else {
  console.log(`✅ Munition trouvée :`, munition);
}
   if (munition) {
  const stockDispo = parseInt(munition.quantite ?? 0);
  const consoMin = munition.stats?.conso_mission_min || 15;

  if (stockDispo < consoMin) {
    malusMunitions += mission.malus_si_pas_assez || 5;
    console.warn(`❌ Pas assez de munitions pour ${arme.nom}, malus appliqué`);
  } else {
    console.log(`✅ Suffisamment de munitions : ${stockDispo}`);

    // 💥 On retire entre consoMin et (consoMin + 5) munitions
    const aRetirer = Math.floor(Math.random() * 6) + consoMin;
    const nouvelleQuantite = Math.max(0, stockDispo - aRetirer);
    console.log(`🔫 Munitions utilisées : -${aRetirer}, reste ${nouvelleQuantite}`);

    // ✅ Trouve la bonne *clé de slot* (slot0, slot1, etc.)
    const coffreEntries = Object.entries(coffres.coffre_munitions_equipee || {});
    const foundEntry = coffreEntries.find(([slotKey, obj]) => obj?.id === munition.id);

    if (foundEntry) {
      const [slotKey] = foundEntry;

      // Mise à jour directe dans l'objet
      munition.quantite = nouvelleQuantite;

      try {
        await updateDoc(doc(firestore, "players", playerId), {
          [`coffre_munitions_equipee.${slotKey}.quantite`]: nouvelleQuantite
        });
        console.log(`✅ Mise à jour Firestore pour ${munition.nom} dans ${slotKey}`);
      } catch (e) {
        console.error("❌ Erreur mise à jour munitions :", e);
      }
    } else {
      console.warn("❌ Clé de slot introuvable pour la munition !");
    }
  }

    }
  }
}


  totalScore += attaqueTotale;
  totalScore -= malusArmes;
  totalScore -= malusMunitions;

  const d20 = Math.floor(Math.random() * 20) + 1;
  const finalScore = totalScore + d20;

  // 📝 Rapport textuel
  let rapport = "";
  if (malusArmes > 0 && malusMunitions > 0) {
    rapport = "⚠️ Le joueur était sous-équipé (aucune arme, peu de munitions), mais a tout de même tenté sa chance.";
  } else if (malusArmes > 0) {
    rapport = "⚠️ Le joueur est parti sans armes, utilisant probablement ses poings.";
  } else if (malusMunitions > 0) {
    rapport = "⚠️ Munitions insuffisantes : le joueur a improvisé.";
  } else {
    rapport = "✅ Équipement et munitions optimaux.";
  }

  // Résultat
  let result;
  if (finalScore >= 30) result = "🎯 Succès critique";
  else if (finalScore >= 25) result = "✅ Succès";
  else result = "❌ Échec";

  // DEBUG
  console.log("DEBUG totalScore avant dé :", totalScore);
  console.log("malusArmes :", malusArmes);
  console.log("malusMunitions :", malusMunitions);
  console.log("d20 :", d20);

  alert(`🧪 Mission ${missionId}
🪪 Rôle : ${role}
🗡 Armes équipées : ${nomsArmes.length > 0 ? nomsArmes.join(", ") : "Aucune"}
🔫 Malus munitions : ${malusMunitions > 0 ? `-${malusMunitions}` : "0"}
🗡 Malus armes : ${malusArmes > 0 ? `-${malusArmes}` : "0"}
🎲 Dé 20 : ${d20}
💥 Attaque totale : ${attaqueTotale}
💪 Score Total : ${finalScore}
📊 Résultat : ${result}
📝 Rapport : ${rapport}`);
}


window.runMissionTest = runMissionTest;

  const tabContents = document.querySelectorAll('.tab-content');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      // Retire la classe active des onglets et contenus
      tabs.forEach(t => t.classList.remove('active'));
      tabContents.forEach(c => c.classList.remove('active'));

      // Active l'onglet cliqué et son contenu correspondant
      tab.classList.add('active');
      const selectedTab = tab.dataset.tab;
      const contentToShow = document.getElementById(selectedTab);
      if (contentToShow) {
        contentToShow.classList.add('active');
      } else {
        console.warn(`⚠️ Contenu introuvable pour l'onglet : ${selectedTab}`);
      }
    });
  });
</script>
